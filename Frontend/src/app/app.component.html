<header class="app-bar">
  <div class="app-bar__inner">
    <a class="brand" routerLink="/">
      <span class="brand__mark"><mat-icon>contacts</mat-icon></span>
      <span class="brand__name">PhoneBook</span>
    </a>

    <nav class="app-nav">
      <a class="app-nav__link" routerLink="/" routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }">Contacts</a>
      <a mat-flat-button routerLink="/addcontact">
        <mat-icon>person_add</mat-icon>
        New contact
      </a>
    </nav>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
